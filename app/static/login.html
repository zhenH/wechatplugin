<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 · 多人格群聊</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; }
    .login-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 36px 40px;
      width: 340px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.35);
    }
    .login-card h1 { font-size: 18px; text-align: center; }
    .login-card p { color: var(--muted); font-size: 12px; text-align: center; }
    .login-card button { padding: 10px; font-size: 14px; }
    #loginErr { color: var(--danger); font-size: 12px; text-align: center; min-height: 16px; }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>🗣 多人格群聊平台</h1>
    <p>请输入访问密码</p>
    <input id="pwd" type="password" placeholder="访问密码" autofocus autocomplete="current-password">
    <button id="loginBtn" class="primary">登 录</button>
    <div id="loginErr"></div>
  </div>
  <script src="/login.js"></script>
</body>
</html>
